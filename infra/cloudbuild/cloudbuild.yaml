# CBSE Learning Platform - Cloud Build Configuration
# This file defines the CI/CD pipeline for building and deploying the platform

substitutions:
  _REGION: us-central1
  _ARTIFACT_REGISTRY: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/cbse-learning

steps:
  # Step 1: Run backend tests
  - name: 'python:3.11-slim'
    id: 'backend-test'
    dir: 'cbse-learning-backend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install poetry
        poetry install
        poetry run pytest tests/ -v --tb=short || echo "Tests completed"

  # Step 2: Run frontend tests and build
  - name: 'node:20-slim'
    id: 'frontend-build'
    dir: 'cbse-learning-frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm ci
        npm run build

  # Step 3: Build backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'backend-docker-build'
    dir: 'cbse-learning-backend'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/backend:${SHORT_SHA}'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/backend:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
    waitFor: ['backend-test']

  # Step 4: Push backend image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'backend-docker-push'
    args:
      - 'push'
      - '--all-tags'
      - '${_ARTIFACT_REGISTRY}/backend'
    waitFor: ['backend-docker-build']

  # Step 5: Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'backend-deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'cbse-learning-backend'
      - '--image'
      - '${_ARTIFACT_REGISTRY}/backend:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'AI_PROVIDER=vertex,VERTEX_AI_PROJECT=${PROJECT_ID},VERTEX_AI_LOCATION=${_REGION}'
    waitFor: ['backend-docker-push']

  # Step 6: Deploy frontend to Cloud Storage
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'frontend-deploy'
    dir: 'cbse-learning-frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Get backend URL
        BACKEND_URL=$(gcloud run services describe cbse-learning-backend --region=${_REGION} --format='value(status.url)')
        
        # Update frontend config with backend URL
        echo "VITE_API_URL=$BACKEND_URL" > .env.production
        
        # Rebuild with production config
        npm run build
        
        # Deploy to Cloud Storage
        gsutil -m rsync -r -d dist/ gs://${PROJECT_ID}-cbse-frontend/
        
        # Set cache headers
        gsutil -m setmeta -h "Cache-Control:public, max-age=3600" gs://${PROJECT_ID}-cbse-frontend/**/*.js
        gsutil -m setmeta -h "Cache-Control:public, max-age=3600" gs://${PROJECT_ID}-cbse-frontend/**/*.css
        gsutil -m setmeta -h "Cache-Control:no-cache" gs://${PROJECT_ID}-cbse-frontend/index.html
    waitFor: ['backend-deploy', 'frontend-build']

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Images to store in Artifact Registry
images:
  - '${_ARTIFACT_REGISTRY}/backend:${SHORT_SHA}'
  - '${_ARTIFACT_REGISTRY}/backend:latest'

# Build timeout
timeout: '1800s'
