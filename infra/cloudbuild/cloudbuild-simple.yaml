# Simple Cloud Build configuration for low-budget deployment
# This builds and deploys a single Cloud Run service
# 
# Usage:
# 1. Connect your GitHub repo to Cloud Build
# 2. Create a trigger pointing to this file
# 3. Push to main branch to trigger deployment

steps:
  # Step 1: Install frontend dependencies and build
  - name: 'node:18'
    dir: 'cbse-learning-frontend'
    entrypoint: 'npm'
    args: ['install']

  - name: 'node:18'
    dir: 'cbse-learning-frontend'
    entrypoint: 'npm'
    args: ['run', 'build']
    env:
      - 'VITE_API_URL='

  # Step 2: Copy frontend build to backend
  - name: 'bash'
    script: |
      cp -r cbse-learning-frontend/dist cbse-learning-backend/

  # Step 3: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cbse-app/backend:$SHORT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cbse-app/backend:latest'
      - 'cbse-learning-backend'

  # Step 4: Push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cbse-app/backend:$SHORT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cbse-app/backend:latest'

  # Step 5: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'cbse-learning-app'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/cbse-app/backend:$SHORT_SHA'
      - '--platform=managed'
      - '--region=asia-south1'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--set-env-vars=AI_PROVIDER=mock,APP_ENV=production'

# Store images in Artifact Registry
images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cbse-app/backend:$SHORT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cbse-app/backend:latest'

# Build options for cost optimization
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_MEDIUM'

# Timeout (10 minutes should be enough)
timeout: '600s'
